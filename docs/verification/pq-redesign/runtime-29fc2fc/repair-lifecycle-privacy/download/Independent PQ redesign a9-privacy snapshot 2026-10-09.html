.mv-panel-heading h2{font-size:13px;font-weight:600;line-height:1.3;margin:0;color:#334155;}
.mv-panel-heading p{font-size:10px;color:#8290a3;margin:5px 0 0;line-height:1.4;}
.mv-graph-toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #edf1f6;flex:none;}
.mv-toolbar-spacer{flex:1;}
.mv-graph-scroll{display:flex;flex:1;min-height:0;overflow:auto;cursor:grab;user-select:none;background-color:#fbfcfe;background-image:radial-gradient(#dce3ed .8px,transparent .8px);background-size:20px 20px;overscroll-behavior:contain;}
.mv-graph-frame{position:relative;flex:none;margin:auto;overflow:hidden;}
.mv-graph-canvas{position:relative;transform-origin:0 0;}
.mv-flow-group{position:absolute;z-index:0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;border:1px dashed #d3d9e4;border-radius:11px;background:#fbfcfe;padding:8px 10px;pointer-events:none;}
.mv-flow-group-head{font:600 10px/1.35 'IBM Plex Sans',sans-serif;color:#77808f;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mv-flow-group-more{align-self:flex-start;pointer-events:auto;border:1px solid #d8dce3;background:#fff;border-radius:9px;height:20px;padding:0 8px;cursor:pointer;font:600 9.5px/18px 'IBM Plex Mono',monospace;color:#5b6472;}
.mv-flow-group-more:hover{border-color:#93b8f5;color:#2563eb;}
.mv-graph-footer{display:flex;align-items:center;flex-wrap:wrap;gap:8px 13px;flex:none;padding:11px 13px;border-top:1px solid #edf1f6;font-size:10px;background:#fff;}
.mv-legend-up{color:#7c3aed;}
.mv-legend-down{color:#2563eb;}
.mv-graph-stat{color:#7c899b;}
.mv-graph-help{font-size:9px;color:#8692a4;}
.mv-cap-notice{margin:0;padding:9px 12px;background:#fff8ec;color:#9a5b18;font-size:11px;line-height:1.4;}
.mv-dax-panel{container-type:inline-size;container-name:measure-dax;}
.mv-dax-grid{flex:1;min-height:0;min-width:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;align-content:start;align-items:start;gap:12px;padding:12px;scrollbar-gutter:stable;}
.mv-dax-grid>.mv-compare-empty,.mv-dax-grid>.mv-column-refs{grid-column:1 / -1;}
@container measure-dax (min-width:760px){.mv-dax-grid[data-comparing=true]{grid-template-columns:repeat(2,minmax(0,1fr));}}
.mv-dax-card{flex:none;min-width:0;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#fff;}
.mv-dax-card-header{padding:12px 13px;background:#f8fafc;border-bottom:1px solid #e7edf4;}
.mv-dax-card-label{display:flex;align-items:center;gap:6px;font-size:9px;text-transform:uppercase;letter-spacing:.65px;font-weight:600;color:#7b879a;}
.mv-dax-card-header h3{font-size:13px;font-weight:600;margin:7px 0 4px;line-height:1.4;overflow-wrap:anywhere;color:#334155;}
.mv-dax-card-meta{font:400 10px/1.5 'IBM Plex Mono',monospace;color:#8190a4;overflow-wrap:anywhere;}
.mv-dax-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;}
.mv-copy-status{font-size:10px;color:#2563eb;}
.mv-copy-status:empty{display:none;}
.mv-dax-body{font:400 13px/1.75 'IBM Plex Mono',monospace;padding:15px 14px;margin:0;color:#334155;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:430px;tab-size:4;}
.mv-dax-code{font:inherit;color:inherit;background:none;padding:0;border-radius:0;}
.mv-dax-ref{font-size:inherit!important;line-height:inherit!important;}
.mv-no-wrap .mv-dax-body{white-space:pre;overflow-wrap:normal;}
.mv-compare-empty{flex:none;border:1px dashed #ccd7e6;border-radius:8px;background:#fafcff;padding:18px 15px;font-size:11px;color:#8390a3;line-height:1.6;}
.mv-compare-empty strong{font-size:12px;color:#697a91;font-weight:500;}
.mv-compare-empty p{margin:6px 0 0;}
.mv-column-refs{flex:none;border:1px solid #e4eaf2;border-radius:7px;padding:12px 13px;color:#75849a;font-size:11px;}
.mv-column-refs summary{cursor:pointer;color:#536780;font-weight:500;}
.mv-column-group{margin-top:10px;line-height:1.7;overflow-wrap:anywhere;}
.mv-column-group>div{font:400 10px/1.7 'IBM Plex Mono',monospace;margin-top:3px;}
.mv-analysis-body[data-mode=dax],.mv-analysis-body[data-mode=graph]{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);}
.mv-analysis-body[data-mode=dax] .mv-graph-panel,.mv-analysis-body[data-mode=graph] .mv-dax-panel,.mv-analysis-body:not([data-mode=split])>.mv-split-divider{display:none;}
.mv-analysis-body[data-mode=dax] .mv-dax-body{max-height:none;}
@media(max-width:1250px){.mv-analysis-header{flex-direction:column;gap:10px;padding:16px 18px;}.mv-view-controls{flex-direction:row;align-items:center;flex-wrap:wrap;}.mv-mode-switch{align-self:flex-start;margin:0;}.mv-analysis-body{padding:10px;}.mv-panel-heading{padding:12px;}.mv-graph-toolbar{padding:8px;}}
@media(max-width:900px){.mv-analysis-header h1{font-size:18px;}.mv-graph-help{display:none;}.mv-starters{grid-template-columns:1fr;}.mv-library-top{padding:16px 12px 12px;}.mv-overview{padding:28px;}.mv-overview-stats{gap:8px;}.mv-overview-stat{padding:14px;}}
@media(max-width:680px){.mv-library{width:220px!important;min-width:190px;max-width:40vw;}.mv-library-heading{flex-direction:column;align-items:flex-start;gap:4px;}.mv-library-top{padding:12px 8px;}.mv-row-count,.mv-row-table,.mv-library-foot{display:none;}.mv-library-row{gap:5px;}.mv-overview{padding:22px 16px;}.mv-overview-stats{grid-template-columns:1fr;}.mv-analysis-header{padding:13px;}.mv-metadata{gap:4px;}.mv-chip{font-size:9px!important;}.mv-mode-switch button{padding:6px;font-size:10px;}.mv-starter-count{display:none;}.mv-analysis-body{padding:7px;}.mv-dax-actions{gap:4px;}}
@media(prefers-reduced-motion:reduce){.mv-workspace *{scroll-behavior:auto!important;transition:none!important;}}
</style>

  Legend.prototype.build = function () {

    var keyOf = app.colorBy === 'source' ? function (t) { return app.srcKeyOf(t); } : function (t) { return t.domain; };
    var labelMap = {};
    Object.keys(app.SOURCE_KINDS).forEach(function (k) { labelMap[k] = app.SOURCE_KINDS[k].label; });
    labelMap.manual = 'Manual'; labelMap.calculated = 'Calculated';
    var tot = {}, vis = {}, hid = {};
    app.model.tables.forEach(function (t) {
      var k = keyOf(t); tot[k] = (tot[k] || 0) + 1;
      if (showSA || t.relCount > 0) vis[k] = (vis[k] || 0) + 1; else hid[k] = (hid[k] || 0) + 1;
    });
    var map = app.colorBy === 'source' ? app._srcMap : app._domMap;
    return Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; }).map(function (k) {

    });
