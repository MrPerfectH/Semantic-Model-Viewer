<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#f4f5f7;font-family:'IBM Plex Sans',system-ui,sans-serif;}
  a{color:#2563eb;} a:hover{color:#1d4ed8;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c7ccd4;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:'IBM Plex Sans',sans-serif;}
  /* style-hover equivalents from the prototype */
  .hv-f1f3f6:hover{background:#f1f3f6;}
  .hv-f5f7f9:hover{background:#f5f7f9;}
  .hv-eef4ff:hover{background:#eef4ff;}
  .hv-eef2f7:hover{background:#eef2f7;}
  .hv-f0f2f5:hover{background:#f0f2f5;}
  .hv-del:hover{background:#fdecec;color:#dc2626;}
  .hv-trace:hover{background:#f1eafc;}
  .hv-blue-b:hover{border-color:#bcd2f7;}
  .hv-blue-bc:hover{border-color:#93b8f5;color:#2563eb;}
  .hv-grey-bc:hover{border-color:#aeb8c6;color:#2b3140;}
  .hv-card:hover{border-color:#bcd2f7;background:#f8faff;}
  .hv-bright:hover{filter:brightness(.96);}
  .hv-dark:hover{color:#1f2430;}
  .hv-up:hover{border-color:#c4b5fd;color:#6d28d9;}
  .hv-dn:hover{border-color:#93b8f5;color:#2563eb;}
  .hv-resize:hover{background:#c8d6ee;}
  .hv-warn:hover{background:#faf1da;}
</style>

<body>
<div id="root" style="position:fixed;inset:0;display:flex;flex-direction:column;background:#f4f5f7;color:#1f2430;overflow:hidden;">
  <header id="topbar" style="flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-height:56px;padding:8px 18px;background:#ffffff;border-bottom:1px solid #e3e6ea;z-index:40;box-shadow:0 1px 2px rgba(20,30,50,.04);"></header>
  <div id="main" style="flex:1;position:relative;min-height:0;overflow:hidden;">
    <div id="canvas" style="position:absolute;inset:0;overflow:hidden;cursor:grab;background-color:#f4f5f7;background-image:radial-gradient(#d9dde3 1.1px,transparent 1.1px);background-size:26px 26px;"></div>
    <aside id="table-library" aria-label="Model table library" hidden></aside>
    <div id="workspace-toolbar" data-canvas-overlay hidden></div>
    <div id="canvas-empty" hidden></div>
    <div id="canvas-navigation" data-canvas-overlay aria-label="Canvas navigation" hidden></div>
    <div id="model-minimap" data-canvas-overlay hidden></div>
    <div id="workspace-status" role="status" aria-live="polite" hidden></div>
    <div id="legend"></div>
    <div id="hint"></div>
    <div id="matrix"></div>
    <div id="measures"></div>
    <div id="drawer"></div>
    <section id="power-query-workspace" aria-label="Power Query workspace" hidden></section>
    <div id="modal"></div>
    <div id="rolesetup"></div>
  </div>
</div>
