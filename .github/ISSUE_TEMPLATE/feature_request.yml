name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Please do not paste confidential model content.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered (optional)
  - type: dropdown
    id: where
    attributes:
      label: Where would it matter?
      multiple: true
      options:
        - Web demo
        - Installed app
        - VS Code extension
        - Saved HTML snapshot
