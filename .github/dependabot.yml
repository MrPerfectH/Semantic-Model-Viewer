version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /vscode-extension
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # @types/vscode must not be newer than engines.vscode, or `vsce package` fails.
      - dependency-name: "@types/vscode"
