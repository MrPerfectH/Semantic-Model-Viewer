name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  runtime:
    uses: ./.github/workflows/fabric-preview.yml
    permissions:
      contents: read
    with:
      prerelease: false
  release:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Check the tag matches the extension version
        working-directory: vscode-extension
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match vscode-extension/package.json version $version" >&2
            exit 1
          fi
      - name: Download verified extension and standalone runtime
        uses: actions/download-artifact@v4
        with:
          name: semantic-model-viewer-fabric-preview
          path: dist/fabric
      - name: Bundle the static web app
        run: |
          mkdir -p dist/semantic-model-viewer-web
          cd Models/tools/viewer
          cp -r index.html *.css js icons sw.js manifest.webmanifest \
            model-data.json report-usage.json ../../../dist/semantic-model-viewer-web/
          cd ../../../dist
          zip -r "semantic-model-viewer-web-${GITHUB_REF_NAME#v}.zip" semantic-model-viewer-web
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Semantic Model Viewer $GITHUB_REF_NAME" \
            --generate-notes \
            dist/fabric/*.vsix \
            dist/fabric/*.zip \
            dist/*.zip
      - name: Publish to the VS Code Marketplace
        # Skipped until the VSCE_PAT repository secret exists.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4 publish --packagePath dist/fabric/*.vsix --skip-duplicate
