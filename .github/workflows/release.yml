name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  runtime:
    uses: ./.github/workflows/fabric-preview.yml
    permissions:
      contents: read
    with:
      prerelease: false
  release:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit from main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point to a commit in main. Merge the release PR first." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Check the tag matches the extension version
        working-directory: vscode-extension
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match vscode-extension/package.json version $version" >&2
            exit 1
          fi
      - name: Download verified extension and standalone runtime
        uses: actions/download-artifact@v8
        with:
          name: semantic-model-viewer-fabric-preview
          path: dist/fabric
      - name: Download tested complete agent packages
        uses: actions/download-artifact@v8
        with:
          name: semantic-model-viewer-complete-agent-packages
          path: dist/agents
      - name: Verify archives and prepare immutable installation catalogs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-agent-release.cjs --assets dist/agents --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --out dist/catalog
      - name: Bundle the static web app
        run: |
          mkdir -p dist/semantic-model-viewer-web
          cd Models/tools/viewer
          cp -r index.html *.css js icons sw.js manifest.webmanifest \
            model-data.json report-usage.json ../../../dist/semantic-model-viewer-web/
          cd ../../../dist
          zip -r "semantic-model-viewer-web-${GITHUB_REF_NAME#v}.zip" semantic-model-viewer-web
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Semantic Model Viewer $GITHUB_REF_NAME" \
            --notes-file .github/release-introduction.md \
            --generate-notes \
            dist/fabric/vscode-extension/*.vsix \
            dist/fabric/dist/*.zip \
            dist/*.zip \
            dist/agents/*.zip \
            dist/agents/*.sha256 \
            dist/catalog/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Update the Claude marketplace only after the archives are public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern smv-claude-portable.zip --dir dist/published
          cmp dist/agents/smv-claude-portable.zip dist/published/smv-claude-portable.zip
          git fetch origin claude-marketplace
          git worktree add --detach dist/marketplace origin/claude-marketplace
          node scripts/update-agent-catalog.cjs dist/marketplace/.claude-plugin/marketplace.json dist/catalog/claude-marketplace.json
          git -C dist/marketplace config user.name github-actions[bot]
          git -C dist/marketplace config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C dist/marketplace add .claude-plugin/marketplace.json
          if ! git -C dist/marketplace diff --cached --quiet; then
            git -C dist/marketplace commit -m "Release bundled SMV agent plugin $GITHUB_REF_NAME"
            git -C dist/marketplace push origin HEAD:claude-marketplace
          fi
      - name: Publish to the VS Code Marketplace
        # Skipped until the VSCE_PAT repository secret exists.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: |
          for package in dist/fabric/vscode-extension/*.vsix; do
            test -f "$package"
            npx --yes @vscode/vsce@4 publish --packagePath "$package" --skip-duplicate
          done
