name: Visual explanations
on:
  pull_request:
  push:
    branches: [feature/visual-explanations]
jobs:
  explanation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: CLI, data contracts, and local session tests
        run: npm test
      - name: Capture the real viewer and build walkthroughs
        run: npm run test:browser
