name: Publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the static app
        run: |
          mkdir site
          cd Models/tools/viewer
          cp -r index.html *.css js icons sw.js manifest.webmanifest \
            model-data.json report-usage.json ../../../site/
          mkdir -p ../../../site/media/vscode-guide
          cp ../../../docs/media/vscode-guide/*.mp4 ../../../site/media/vscode-guide/
          touch ../../../site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
