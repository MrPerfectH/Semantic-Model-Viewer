name: Publish to Marketplace

# Publishes the .vsix of an existing GitHub release to the VS Code Marketplace.
# Use it for a release made before the Release workflow published on its own, or to retry.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.3.4
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Require a release commit from main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Only releases whose commits are in main can be published." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download the release .vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir dist
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for package in dist/*.vsix; do
            test -f "$package"
            npx --yes @vscode/vsce@4 publish --packagePath "$package" --skip-duplicate
          done
