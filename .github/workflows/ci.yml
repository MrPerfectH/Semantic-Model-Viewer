name: CI

on:
  push:
    branches: [main, develop, feature/fabric-connect]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Launcher tests compare the renderer with cached origin/main.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install CLI and MCP dependencies
        run: npm ci
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Linux XMLA helper
        run: |
          dotnet publish tools/fabric/xmla/Smv.Fabric.Xmla.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o tools/fabric/xmla/publish/linux-x64
          node tools/fabric/xmla/copy-notices.cjs linux-x64 tools/fabric/xmla/publish/linux-x64
      - name: Test viewer and extension
        working-directory: vscode-extension
        run: npm test
      - name: Check measure layouts and offline snapshots in Chrome
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 tests/measures-layout.browser.cjs tests/snapshot.browser.cjs tests/demo-initial-viewport.browser.cjs
      - name: Package the extension
        working-directory: vscode-extension
        env:
          IS_PREVIEW: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            npm run package -- --pre-release
          else
            npm run package
          fi
  distribution:
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    uses: ./.github/workflows/fabric-preview.yml
    with:
      prerelease: true

  publish-preview:
    needs: [test, distribution]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: marketplace-pre-release
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: semantic-model-viewer-fabric-preview
          path: dist
      - name: Publish the tested pre-release to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Configure the VSCE_PAT repository secret to publish pre-releases."
            exit 1
          fi
          test -f dist/vscode-extension/semantic-model-viewer-fabric-preview.vsix
          npx --yes @vscode/vsce@4 publish --packagePath dist/vscode-extension/semantic-model-viewer-fabric-preview.vsix --pre-release --skip-duplicate
