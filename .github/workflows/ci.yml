name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Launcher tests compare the renderer with cached origin/main.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - name: Test viewer and extension
        working-directory: vscode-extension
        run: npm test
      - name: Check measure layouts and offline snapshots in Chrome
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 tests/measures-layout.browser.cjs tests/snapshot.browser.cjs tests/demo-initial-viewport.browser.cjs
      - name: Package the extension
        working-directory: vscode-extension
        env:
          IS_PREVIEW: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            npm run package -- --pre-release
          else
            npm run package
          fi
      - name: Upload the develop test extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-model-viewer-preview-${{ github.sha }}
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 14
