name: CI

on:
  push:
    branches: [main, feature/fabric-connect]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Linux XMLA helper
        run: |
          dotnet publish tools/fabric/xmla/Smv.Fabric.Xmla.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o tools/fabric/xmla/publish/linux-x64
          node tools/fabric/xmla/copy-notices.cjs linux-x64 tools/fabric/xmla/publish/linux-x64
      - name: Test viewer and extension
        working-directory: vscode-extension
        run: npm test
      - name: Package the extension
        working-directory: vscode-extension
        run: npm run package
