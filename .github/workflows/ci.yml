name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install CLI and MCP dependencies
        run: npm ci
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - name: Test viewer and extension
        working-directory: vscode-extension
        run: npm test
      - name: Package the extension
        working-directory: vscode-extension
        env:
          IS_PREVIEW: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            cp README.md /tmp/smv-stable-readme.md
            cat ../docs/pre-release.md /tmp/smv-stable-readme.md > README.md
            npm run package -- --pre-release
            mv /tmp/smv-stable-readme.md README.md
          else
            npm run package
          fi
      - name: Upload the develop test extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-model-viewer-preview-${{ github.sha }}
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 14
