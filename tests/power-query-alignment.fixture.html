*{box-sizing:border-box}body{margin:0;background:#fff;color:#293b56;font:13px/1.5 'IBM Plex Sans',system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #dce5ef;background:#fff;color:#527096;border-radius:6px;padding:6px 10px}button:hover{background:#f0f5ff}button:focus-visible,input:focus-visible{outline:2px solid #2563eb;outline-offset:2px}.testbar{display:flex;gap:10px;align-items:center;padding:13px 20px;border-bottom:1px solid #e1e7ef}.testbar strong{margin-right:auto}.testbar small{color:#8b96a8}.workspace{display:grid;grid-template-columns:268px minmax(0,1fr);height:calc(100vh - 59px)}.library{padding:22px 16px;border-right:1px solid #e1e7ef;overflow:auto}.library h2{margin:0 0 14px;font-size:14px}.library input{width:100%;padding:8px;border:1px solid #dce5ef;border-radius:5px;font-size:11px}.categories{display:flex;gap:3px;flex-wrap:wrap;margin:13px 0}.categories button{font-size:9px;padding:5px}.categories .active{background:#edf3ff;border-color:#bed0f0;color:#245cbd}.library-row{display:block;width:100%;text-align:left;border:0;margin:4px 0;padding:9px 8px;font-size:11px}.library-row small{display:block;color:#8b96aa;font-size:10px;margin-top:4px}.library-row.selected{background:#edf3ff;color:#285bac}.fixture-main{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column}.tools{display:flex;align-items:center;gap:7px;min-height:62px;padding:11px 18px;border-bottom:1px solid #e1e7ef;flex-wrap:wrap}.tools strong{margin-right:auto;font-size:12px}.tools small{color:#8a96aa;font-size:10px}.tools button{font-size:11px}.panes{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;flex:1}.panes.open{grid-template-columns:minmax(0,1fr) 400px}#canvasHost{min-width:0;min-height:300px;outline:none}#canvasHost:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}#inspectorHost{display:none;min-height:0;overflow:hidden;border-left:1px solid #e1e7ef}.panes.open #inspectorHost{display:block}.banner{display:none;padding:8px 14px;background:#fff7e8;border-bottom:1px solid #efe3cc;font-size:11px}.banner.show{display:flex;align-items:center;justify-content:space-between}.foot{padding:7px 15px;border-top:1px solid #e1e7ef;color:#909db0;font-size:10px}.empty{font-size:11px;color:#8a97aa;padding:10px}.edge-detail{position:absolute;z-index:3;width:240px;background:white;border:1px solid #d8e2f0;border-radius:8px;padding:13px;box-shadow:0 6px 24px #2539571a;font-size:11px}.workspace.collapsed{grid-template-columns:1fr}.workspace.collapsed .library{display:none}@media(max-width:1100px){.panes.open{grid-template-columns:1fr;grid-template-rows:minmax(220px,1fr) minmax(220px,.95fr)}#canvasHost{min-height:220px}#inspectorHost{border-left:0;border-top:1px solid #e1e7ef}}@media(max-width:640px){.testbar small{display:none}.workspace{grid-template-columns:1fr}.library{display:none}.workspace.show-library .library{display:block;max-height:280px;border-bottom:1px solid #e1e7ef}.workspace{height:auto;min-height:calc(100vh - 59px)}.panes{min-height:380px}.panes.open{grid-template-rows:300px 380px;min-height:680px;flex:none}.tools{gap:4px;padding:9px}.tools strong{width:100%;margin:0}.pqi{padding:14px}}

<header class="testbar"><strong>Power Query</strong><small>Owned-module fixture · synthetic metadata only</small><button id="queries">Queries</button><button id="modelReset">Replace model</button></header>
<div class="workspace" id="workspace"><aside class="library"><h2>Query library</h2><input id="search" type="search" aria-label="Find query" placeholder="Find query or parameter…"><div class="categories"><button data-category="all" class="active">All</button><button data-category="connected">Connected</button><button data-category="disconnected">Disconnected</button></div><div id="rows"></div><p class="empty">Zero resolved links does not prove independence.</p></aside><main class="fixture-main"><div class="tools"><strong id="total">Whole model</strong><button id="back" disabled>Back</button><button id="minus" aria-label="Zoom out">−</button><small id="zoom">100%</small><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit all</button><button id="resetFilters">Reset filters</button></div><div class="banner" id="hiddenBanner"><span>Selected query is hidden by filter</span><button id="showAll">Show all</button></div><div class="panes" id="panes"><div id="canvasHost" tabindex="0"></div><div id="inspectorHost"></div></div><div class="foot" id="announcement" role="status" aria-live="polite">Partial static references · no M is executed.</div></main></div>
<script src="../Models/tools/viewer/js/power-query-dependencies.js"></script><script src="../Models/tools/viewer/js/power-query-graph-model.js"></script><script src="../Models/tools/viewer/js/workspace-ui.js"></script><script src="../Models/tools/viewer/js/power-query-canvas.js"></script><script src="../Models/tools/viewer/js/power-query-inspector.js"></script>
<script>
// Test-only coordinator adapter. This is not shipped shell/worker implementation.
const $=s=>document.querySelector(s), frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const query=(name,code,extra={})=>({id:JSON.stringify(['expression','',name]),kind:'expression',name,table:null,type:'m',state:'available',code,classification:'query',basis:'Synthetic syntax hint (not evaluated)',...extra});
const part=(table,code,extra={})=>({...query('Main',code),id:JSON.stringify(['partition',table,'Main']),kind:'partition',table,...extra});
const source='let\r\n  // 😀 Sales Raw in comments never navigates\r\n  Merged = Table.NestedJoin(#"Sales Raw", {"ID"}, Customers, {"ID"}, "Customer"),\r\n  Again = #"Sales#(0020)Raw",\r\n  Note = "<script>source stays text</scr'+'ipt> '+'.'.repeat(190)+'"\r\nin Merged\r\n'+Array.from({length:32},(_,i)=>'// Exact source line '+(i+1)+'  ').join('\r\n')+'\r\n';
const synthetic={tables:['Sales Enriched','Sales All','Calculated','Missing','No partitions'].map(name=>({name})),powerQuery:{nodes:[query('Server','"example" meta [IsParameterQuery=true]',{classification:'parameter',basis:'M metadata marker (not evaluated)'}),query('Sales Raw','let\r\n  Source = Sql.Database(Server, "Synthetic")\r\nin Source'),query('Customers','Server'),part('Sales Enriched',source),query('Sales Archive','1'),part('Sales All','Table.Combine({#"Sales Enriched", #"Sales Archive"})'),query('Exchange Rates','1'),query('Calendar','1'),query('Cycle A','#"Cycle B"'),query('Cycle B','#"Cycle A"'),query('Duplicate','1'),query('Duplicate','2'),part('Calculated',null,{type:'calculated',state:'non-m'}),part('Missing',null,{type:'unknown',state:'missing'})],warnings:[]}};
let mode='dim',direction='connected',depth=1;let generation=1, selected=null, open=false, category='all', history=[], navEpoch=0, lastEdge=null;
function presentation(model,gen){const graph=PowerQueryGraphModel.build(model,{generation:gen}),byNodeId=new Map();graph.nodes.forEach((node,index)=>{const metadataRow=index<model.powerQuery.nodes.length?model.powerQuery.nodes[index]:null;if(metadataRow&&metadataRow.id!==node.metadataId)throw Error('Pairing mismatch');const inputs=graph.edges.filter(e=>e.consumerId===node.id),outputs=graph.edges.filter(e=>e.inputId===node.id);byNodeId.set(node.id,{node,metadataRow,chrome:{color:node.kind==='parameter'?'#908a84':node.table?'#d363e3':'#8896aa',badge:node.kind==='parameter'?'P':'Q',subtitle:node.subtitle},code:metadataRow?.code??null,classification:metadataRow?.classification??null,basis:metadataRow?.basis??null,type:metadataRow?.type??null,state:node.state,occurrences:inputs.flatMap(e=>e.referenceOccurrences.map(r=>({...r,targetId:e.inputId}))).sort((a,b)=>a.at-b.at),issues:graph.issues.filter(i=>i.consumerId===node.id),inputIds:inputs.map(e=>e.inputId),consumerIds:outputs.map(e=>e.consumerId)});});return {version:2,generation:gen,graph,byNodeId,globalIssues:graph.issues.filter(i=>i.consumerId===null)};}
let context=presentation(synthetic,generation);
function connected(){return new Set(context.graph.edges.flatMap(e=>[e.inputId,e.consumerId]));}
function categoryIds(){const set=connected();return new Set(context.graph.nodes.filter(n=>category==='all'||(category==='connected'?set.has(n.id):!set.has(n.id))).map(n=>n.id));}
function view(){return {generation,selected,open,category,search:$('#search').value,viewport:canvas.getViewport(),inspector:inspector.captureViewState()};}
function neighborhood(){const result=new Set(selected?[selected]:[]);let layer=selected?[selected]:[];for(let level=0;layer.length&&level<depth;level++){const next=[];context.graph.edges.forEach(e=>{if(direction!=='consumers'&&layer.includes(e.consumerId)&&!result.has(e.inputId)){result.add(e.inputId);next.push(e.inputId);}if(direction!=='inputs'&&layer.includes(e.inputId)&&!result.has(e.consumerId)){result.add(e.consumerId);next.push(e.consumerId);}});layer=next;}return result;}
function renderLibrary(){const cat=categoryIds(),search=$('#search').value.toLowerCase(),matches=new Set(context.graph.nodes.filter(n=>n.label.toLowerCase().includes(search)).map(n=>n.id));const focus=neighborhood();canvas.setFocusIds(selected?focus:null);canvas.setVisibleIds(mode==='hide'&&selected?new Set([...cat].filter(id=>focus.has(id))):category==='all'?null:cat);canvas.setMatches(search?matches:null);if(selected)inspector.setFocusControls({mode,direction,depth,relatedCount:focus.size-1,missingCount:0,removableCount:cat.size-focus.size});$('#rows').replaceChildren();const items=context.graph.nodes.filter(n=>cat.has(n.id)&&matches.has(n.id));items.forEach(n=>{const b=document.createElement('button');b.className='library-row'+(selected===n.id?' selected':'');b.textContent=n.label;const sub=document.createElement('small');sub.textContent=n.subtitle;b.append(sub);b.onclick=()=>navigate(n.id);$('#rows').append(b);});if(!items.length){const e=document.createElement('p');e.className='empty';e.textContent='0 results in this filter/search';$('#rows').append(e);}const set=connected();document.querySelectorAll('[data-category]').forEach(b=>{b.classList.toggle('active',b.dataset.category===category);b.textContent=b.dataset.category[0].toUpperCase()+b.dataset.category.slice(1)+' '+(b.dataset.category==='all'?context.graph.nodes.length:b.dataset.category==='connected'?set.size:context.graph.nodes.length-set.size);});$('#hiddenBanner').classList.toggle('show',!!selected&&!cat.has(selected));$('#total').textContent=context.graph.nodes.length+' objects · '+context.graph.edges.length+' links';$('#back').disabled=!history.length;}
function pick(id,opened=true){navEpoch++;selected=id;open=!!id&&opened;$('#panes').classList.toggle('open',open);canvas.setSelection(id);inspector.select(id,{open});renderLibrary();}
function navigate(id){if(selected)history.push(view());if(!categoryIds().has(id)||$('#search').value){category='all';$('#search').value='';$('#announcement').textContent='Filters cleared to show referenced query';}pick(id,true);canvas.reveal(id,{readable:true});canvas.focusNode(id);}
async function back(){const saved=history.pop();if(!saved||saved.generation!==generation)return;category=saved.category;$('#search').value=saved.search;pick(saved.selected,saved.open);const epoch=navEpoch;canvas.setViewport(saved.viewport);await inspector.restoreViewState(saved.inspector);if(saved.generation===generation&&navEpoch===epoch)canvas.setViewport(saved.viewport);}
const canvas=PowerQueryCanvas.mount($('#canvasHost'),{context,onSelect:e=>pick(e.nodeId,!!e.nodeId),onViewport:e=>$('#zoom').textContent=Math.round(e.viewport.k*100)+'%',onEdge:e=>{lastEdge=e;document.querySelector('.edge-detail')?.remove();const edge=context.graph.edges.find(v=>v.id===e.edgeId),node=context.byNodeId.get(edge.consumerId),detail=document.createElement('div');detail.className='edge-detail';detail.textContent=context.byNodeId.get(edge.inputId).node.label+' is referenced by '+node.node.label;const close=document.createElement('button');close.textContent='Close';close.onclick=()=>detail.remove();detail.append(close);detail.style.left=($('#canvasHost').getBoundingClientRect().left+e.anchor.x)+'px';detail.style.top=($('#canvasHost').getBoundingClientRect().top+e.anchor.y)+'px';document.body.append(detail);}});
const inspector=PowerQueryInspector.mount($('#inspectorHost'),{context,onFocusChange:e=>{mode=e.mode;direction=e.direction;depth=e.depth;renderLibrary();},onMembershipAction:e=>{document.getElementById('announcement').textContent='Test callback only: '+e.action;},onNavigate:e=>navigate(e.targetId),onClose:e=>{open=false;navEpoch++;$('#panes').classList.remove('open');inspector.select(selected,{open:false});if(!canvas.focusNode(selected))$('#canvasHost').focus();}});
$('#search').oninput=renderLibrary;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderLibrary();});$('#queries').onclick=()=>{$('#workspace').classList.toggle('collapsed');$('#workspace').classList.toggle('show-library');};$('#plus').onclick=()=>canvas.zoomBy(1.2);$('#minus').onclick=()=>canvas.zoomBy(1/1.2);$('#fit').onclick=()=>canvas.fit();$('#back').onclick=back;$('#resetFilters').onclick=()=>{category='all';$('#search').value='';renderLibrary();};$('#showAll').onclick=()=>{category='all';$('#search').value='';renderLibrary();if(selected){canvas.reveal(selected,{readable:true});canvas.focusNode(selected);}};
function reset(){mode='dim';direction='connected';depth=1;generation++;navEpoch++;canvas.setContext(null);inspector.setContext(null);selected=null;open=false;history=[];category='all';$('#search').value='';$('#panes').classList.remove('open');context=presentation(synthetic,generation);canvas.setContext(context);inspector.setContext(context);renderLibrary();}
$('#modelReset').onclick=reset;
$('#workspace').addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.defaultPrevented&&open){e.preventDefault();open=false;navEpoch++;$('#panes').classList.remove('open');inspector.select(selected,{open:false});if(!canvas.focusNode(selected))$('#canvasHost').focus();}});
function large(count){generation++;navEpoch++;selected=null;open=false;category='all';history=[];$('#search').value='';$('#panes').classList.remove('open');const nodes=Array.from({length:count},(_,i)=>({id:'large-'+i,metadataId:'large-'+i,label:i===0?'Shared parameter':'Query '+i,subtitle:'Synthetic M',kind:i===0?'parameter':'query',state:'available'})),edges=Array.from({length:Math.min(250,count-1)},(_,i)=>({id:'fanout-'+i,inputId:'large-0',consumerId:'large-'+(i+1),referenceOccurrences:[]}));context={version:2,generation,graph:{nodes,edges,issues:[],analysisProgress:{total:count,analyzed:count,complete:true,generation}},byNodeId:new Map(nodes.map(n=>[n.id,{node:n,code:'1',classification:n.kind,basis:'Synthetic fixture',type:'m',state:'available',issues:[],occurrences:[],inputIds:[],consumerIds:[]}]))};const start=performance.now();canvas.setContext(context);inspector.setContext(context);renderLibrary();return performance.now()-start;}
renderLibrary();
window.uiFixture={canvas,inspector,setFocus(settings){mode=settings.mode;direction=settings.direction;depth=settings.depth;renderLibrary();},get context(){return context;},get selected(){return selected;},get lastEdge(){return lastEdge;},pick,navigate,back,reset,large,setCategory(value){category=value;renderLibrary();},source};
window.runModuleChecks=async function(){const checks=[],timings=[];function check(name,pass,detail){checks.push({name,pass,detail});if(!pass)throw Error(name+': '+JSON.stringify(detail));}reset();await frame();check('all 15 nodes on ready',document.querySelectorAll('.pqc-node').length===15,document.querySelectorAll('.pqc-node').length);const id=context.graph.nodes.find(n=>n.label==='Sales Enriched').id;pick(id);await frame();check('13px source and line numbers',getComputedStyle(document.querySelector('.pqi-code-scroll')).fontSize==='13px'&&document.querySelectorAll('.pqi-line-number').length>30);check('exact CRLF source DOM',Array.from(document.querySelectorAll('.pqi-source-line')).map(e=>e.textContent).join('')===source);canvas.setViewport({x:71,y:-31,k:1.1});const code=document.querySelector('.pqi-code-scroll');code.scrollLeft=81;code.scrollTop=77;const saved=view();document.querySelector('.pqi-reference').click();await frame();await back();await frame();check('Back exact viewport and scroll',JSON.stringify(canvas.getViewport())===JSON.stringify(saved.viewport)&&inspector.captureViewState().codeY===saved.inspector.codeY,{viewport:canvas.getViewport(),scroll:inspector.captureViewState()});uiFixture.setCategory('disconnected');check('hidden selection preserved and explicit banner',selected===id&&$('#hiddenBanner').classList.contains('show')&&!!document.querySelector('.pqi-reference'));check('excluded reveal false',canvas.reveal(id,{readable:true})===false);$('#showAll').click();check('Show all retains layout selection',selected===id&&!$('#hiddenBanner').classList.contains('show'));const before=document.querySelector('.pqi-code-scroll');$('#search').value='not a real query';renderLibrary();check('search preserves inspector and dims only',document.querySelector('.pqi-code-scroll')===before&&document.querySelectorAll('.pqc-node:not([hidden])').length===15&&$('#rows').textContent.includes('0 results'));$('#resetFilters').click();const pending=inspector.restoreViewState({codeY:888,wrap:true,focus:{kind:'copy',nodeId:id}});pick(context.graph.nodes[1].id);await pending;check('same-generation late restore cancelled',inspector.captureViewState().codeY===0&&!inspector.captureViewState().wrap);const fixed={x:81,y:37,k:.63};$('#panes').classList.remove('open');canvas.setViewport(fixed);await frame();check('queued docking resize preserves explicit restore',JSON.stringify(canvas.getViewport())===JSON.stringify(fixed),canvas.getViewport());for(const count of [300,301,350,1000]){const layoutMs=large(count);await frame();const start=performance.now();canvas.fit();const fitMs=performance.now()-start;const searchStart=performance.now();canvas.setMatches(new Set(['large-'+(count-1)]));canvas.reveal('large-'+(count-1),{readable:true});const searchRevealMs=performance.now()-searchStart;check('large inventory '+count,document.querySelectorAll('.pqc-node').length===count&&canvas.captureLayout().size===count&&canvas.focusNode('large-'+(count-1)));timings.push({count,layoutMs,fitMs,searchRevealMs,edges:context.graph.edges.length});}reset();pick(context.graph.nodes[3].id);await frame();const stale=document.querySelector('.pqi-reference');canvas.setContext(null);inspector.setContext(null);check('destructive reset removes source DOM',document.querySelectorAll('.pqi-source-line').length===0&&document.querySelectorAll('.pqc-node').length===0);stale.click();check('detached reference cannot navigate',document.querySelectorAll('.pqi-source-line').length===0);reset();return {checks,timings,width:innerWidth,height:innerHeight,boundary:'Tables-aligned owned modules, authored synthetic context only; no shell worker/CSP, source parser scale, installed or user acceptance.'};};
</script></html>
